<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S3 Bucket Viewer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" title="S3 Bucket Viewer">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
      </div>
      <select id="connectionSelect" aria-label="Connection"></select>
      <button id="addConnBtn" class="icon-btn" title="Add connection" aria-label="Add connection"></button>
      <button id="manageBtn" class="icon-btn" title="Manage connections" aria-label="Manage connections"></button>
    </header>

    <nav id="breadcrumb" class="breadcrumb" aria-label="Path"></nav>

    <div class="toolbar">
      <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh"></button>
      <span class="spacer"></span>
      <button id="newFolderBtn" class="btn" disabled></button>
      <button id="uploadBtn" class="btn" disabled></button>
      <input type="file" id="uploadInput" multiple hidden />
    </div>

    <div id="status" class="status" hidden></div>

    <main id="fileList" class="file-list"></main>
    <button id="loadMoreBtn" class="load-more" hidden>Load more</button>

    <dialog id="connectionModal">
      <form id="connectionForm" method="dialog">
        <h2 id="connectionModalTitle">Add connection</h2>
        <input type="hidden" id="connId" />
        <label class="field">
          <span>Bucket name</span>
          <input id="connBucket" required autocomplete="off" placeholder="my-bucket" />
        </label>
        <label class="field">
          <span>Access key ID</span>
          <input id="connAccessKey" required autocomplete="off" />
        </label>
        <label class="field">
          <span>Secret access key</span>
          <span class="input-with-action">
            <input id="connSecretKey" type="password" required autocomplete="off" />
            <button type="button" id="toggleSecretBtn" class="icon-btn ghost" title="Show/hide" aria-label="Show or hide secret key"></button>
          </span>
        </label>
        <label class="field">
          <span>Key prefix <em>(optional, starting folder)</em></span>
          <input id="connPrefix" placeholder="e.g. logs/2026/" />
        </label>
        <label class="field">
          <span>Name <em>(optional, defaults to bucket name)</em></span>
          <input id="connName" placeholder="e.g. Personal, Work" />
        </label>
        <details class="advanced">
          <summary>Advanced (region auto-detected)</summary>
          <label class="field">
            <span>Region</span>
            <input id="connRegion" placeholder="auto-detected from bucket" />
          </label>
          <label class="field">
            <span>Custom endpoint <em>(optional, for S3-compatible services)</em></span>
            <input id="connEndpoint" placeholder="e.g. abc123.r2.cloudflarestorage.com" />
          </label>
          <label class="field checkbox">
            <input type="checkbox" id="connPathStyle" /> <span>Use path-style URLs</span>
          </label>
        </details>
        <p class="hint">Keys are stored only in this browser (chrome.storage.local).</p>
        <div id="connFormStatus" class="status" hidden></div>
        <div class="modal-actions">
          <button type="button" id="connDeleteBtn" class="btn danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" id="connCancelBtn" class="btn">Cancel</button>
          <button type="submit" id="connSaveBtn" class="btn primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="manageModal">
      <h2>Manage connections</h2>
      <ul id="manageList" class="manage-list"></ul>
      <div class="modal-actions">
        <button id="importBtn" class="btn">Import</button>
        <button id="exportBtn" class="btn">Export</button>
        <input type="file" id="importInput" accept="application/json" hidden />
        <span class="spacer"></span>
        <button id="manageCloseBtn" class="btn primary">Close</button>
      </div>
    </dialog>

    <dialog id="confirmDialog" class="alert-dialog">
      <div class="alert-body">
        <span id="confirmIcon" class="alert-icon"></span>
        <div>
          <h2 id="confirmTitle"></h2>
          <p id="confirmMessage"></p>
        </div>
      </div>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button type="button" id="confirmCancelBtn" class="btn">Cancel</button>
        <button type="button" id="confirmOkBtn" class="btn danger">Confirm</button>
      </div>
    </dialog>

    <dialog id="promptDialog" class="alert-dialog">
      <form id="promptForm" method="dialog">
        <h2 id="promptTitle"></h2>
        <label class="field">
          <span id="promptLabel"></span>
          <input id="promptInput" required />
        </label>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button type="button" id="promptCancelBtn" class="btn">Cancel</button>
          <button type="submit" id="promptOkBtn" class="btn primary">OK</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
